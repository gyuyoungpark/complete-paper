name: tests

on:
  push:
  pull_request:

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: plugin.json and SKILL.md carry the same version
        run: python tools/version.py check
      - name: Install the figure dependencies
        run: python -m pip install matplotlib numpy
      - name: Unit tests and planted-fault cases (offline)
        run: python -m unittest discover -s tests -v
      - name: Build the skill package
        run: python tools/build_skill.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: complete-paper.skill
          path: dist/complete-paper.skill
