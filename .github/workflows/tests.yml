name: tests

on:
  push:
  pull_request:

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python each runner still provides, and the newest. Linux runners no longer offer 3.9.
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: plugin.json and SKILL.md carry the same version
        run: python tools/version.py check
      - name: Install the figure dependencies
        run: python -m pip install matplotlib numpy
      - name: Unit tests and planted-fault cases (offline)
        run: python -m unittest discover -s tests -v
      - name: Build the skill package
        run: python tools/build_skill.py
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: complete-paper.skill
          path: dist/complete-paper.skill
